<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10203a" />
  <title>Mi Álbum · Mundial 2026</title>
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-ball">⚽</span>
      <div>
        <h1>Mi Álbum Mundial 2026</h1>
        <p class="brand-sub">Panini · 980 cromos</p>
      </div>
      <div class="menu">
        <button class="menu-btn" id="menu-toggle" title="Opciones">⋯</button>
      </div>
    </div>

    <div class="progress-box">
      <div class="progress-top">
        <span class="progress-big" id="progress-big">0%</span>
        <span class="progress-count" id="progress-count">0 / 980 cromos</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="extra-prog" id="extra-prog">🥤 Extras Coca-Cola: 0 / 12</div>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-num" id="stat-owned">0</span><span class="stat-lbl">Tengo</span></div>
      <div class="stat"><span class="stat-num" id="stat-missing">0</span><span class="stat-lbl">Faltan</span></div>
      <div class="stat stat-dup"><span class="stat-num" id="stat-dupes">0</span><span class="stat-lbl">Repes</span></div>
    </div>

    <div class="search-wrap">
      <input type="search" id="search" placeholder="Buscar equipo, jugador o nº…" autocomplete="off" />
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="album">📖 Álbum</button>
      <button class="tab" data-tab="missing">🔍 Faltan</button>
      <button class="tab" data-tab="duplicates">🔁 Repes</button>
    </nav>
  </header>

  <main id="content" class="content"></main>

  <footer class="app-footer">
    <p>Toca un cromo para marcarlo. Vuelve a tocar para sumar repetidas. Usa <b>−</b> para quitar y <b>✎</b> para renombrar.</p>
    <p class="footer-soon">Próximamente: cuentas e intercambio / venta entre usuarios 🤝</p>
  </footer>

  <!-- Menú de opciones (hoja inferior con fondo, no tapa el contenido) -->
  <div class="sheet-backdrop" id="menu-backdrop" hidden>
    <div class="sheet" id="menu-pop">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">Opciones</h3>
      <button id="btn-export">⬇️ Exportar respaldo</button>
      <button id="btn-import">⬆️ Importar respaldo</button>
      <button id="btn-reset" class="danger">🗑️ Reiniciar todo</button>
      <button id="btn-close-menu" class="sheet-close">Cerrar</button>
      <input type="file" id="import-file" accept="application/json" hidden />
    </div>
  </div>

  <script src="js/data.js?v=6"></script>
  <script src="js/storage.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
  <script>
    // Menú de opciones como hoja inferior con fondo oscuro
    (function () {
      var toggle = document.getElementById("menu-toggle");
      var backdrop = document.getElementById("menu-backdrop");
      var pop = document.getElementById("menu-pop");
      var close = document.getElementById("btn-close-menu");
      function open() { backdrop.hidden = false; }
      function hide() { backdrop.hidden = true; }
      toggle.addEventListener("click", open);
      close.addEventListener("click", hide);
      backdrop.addEventListener("click", function () { hide(); });
      pop.addEventListener("click", function (e) { e.stopPropagation(); });
      // cerrar la hoja también tras elegir exportar/importar/reiniciar
      ["btn-export", "btn-import", "btn-reset"].forEach(function (id) {
        document.getElementById(id).addEventListener("click", function () { setTimeout(hide, 50); });
      });
    })();
  </script>
</body>
</html>
