<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swalbum · Logo</title>
  <style>
    body{margin:0;font-family:system-ui,Arial,sans-serif;background:#0d1117;color:#eaf1ff;padding:24px 16px;}
    h1{font-size:20px;text-align:center;margin:0 0 24px;}
    .grid{display:flex;flex-direction:column;gap:20px;max-width:420px;margin:0 auto;}
    .card{background:#161b22;border:1px solid #2a313c;border-radius:18px;padding:20px;text-align:center;}
    .card.mark img{width:150px;}
    .card.lock img{width:80%;}
    .card img{height:auto;}
    .tag{font-size:15px;font-weight:700;margin-top:12px;}
    .desc{font-size:13px;color:#8b97a7;margin-top:4px;}
  </style>
</head>
<body>
  <h1>Swalbum · Logo</h1>
  <div class="grid">
    <div class="card lock">
      <img src="assets/logo/swalbum-lockup.png" alt="Logo Swalbum" />
      <div class="tag">Logo principal</div>
      <div class="desc">Ícono + nombre (pantalla de inicio).</div>
    </div>
    <div class="card mark">
      <img src="assets/logo/swalbum-mark.png" alt="Ícono Swalbum" />
      <div class="tag">Ícono</div>
      <div class="desc">Para la cabecera, el favicon y el ícono de la app.</div>
    </div>
  </div>
</body>
</html>
