<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swalbum · Logo</title>
  <style>
    body{margin:0;font-family:system-ui,Arial,sans-serif;background:#0b1626;color:#eaf1ff;padding:24px 16px;}
    h1{font-size:20px;text-align:center;margin:0 0 24px;}
    .grid{display:flex;flex-direction:column;gap:20px;max-width:420px;margin:0 auto;}
    .card{background:#16263f;border:1px solid #28406a;border-radius:18px;padding:18px;text-align:center;}
    .card img{width:160px;height:160px;}
    .tag{font-size:16px;font-weight:700;margin-top:10px;}
    .lockup{display:flex;align-items:center;justify-content:center;gap:12px;}
    .lockup img{width:60px;height:60px;}
    .word{font-size:34px;font-weight:800;font-style:italic;letter-spacing:1px;
      background:linear-gradient(90deg,#33a0ff,#7a2ff2,#ff4d3d,#ff9d00);
      -webkit-background-clip:text;background-clip:text;color:transparent;}
    .desc{font-size:13px;color:#9fb3d4;margin-top:6px;}
  </style>
</head>
<body>
  <h1>⚽ Swalbum · Logo nuevo (vector)</h1>
  <div class="grid">
    <div class="card">
      <img src="assets/logo/swalbum-icon.svg" alt="Logo Swalbum" />
      <div class="tag">Ícono</div>
      <div class="desc">La "S" en degradado sobre las láminas azules.</div>
    </div>
    <div class="card">
      <div class="lockup">
        <img src="assets/logo/swalbum-icon.svg" alt="" />
        <span class="word">SWALBUM</span>
      </div>
      <div class="desc">Versión horizontal (ícono + nombre).</div>
    </div>
  </div>
</body>
</html>
