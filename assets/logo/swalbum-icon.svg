<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Swalbum">
  <defs>
    <linearGradient id="cardDk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d49b8"/>
      <stop offset="1" stop-color="#0f2c74"/>
    </linearGradient>
    <linearGradient id="cardMd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bf2"/>
      <stop offset="1" stop-color="#1740b0"/>
    </linearGradient>
    <linearGradient id="cardLt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f9bff"/>
      <stop offset="1" stop-color="#3a6bf0"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0.15" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#33a0ff"/>
      <stop offset="0.42" stop-color="#7a2ff2"/>
      <stop offset="0.72" stop-color="#ff4d3d"/>
      <stop offset="1" stop-color="#ff9d00"/>
    </linearGradient>
  </defs>

  <!-- Pila de láminas / cromos (efecto abanico) -->
  <rect x="76" y="58" width="104" height="140" rx="16" fill="url(#cardDk)" transform="rotate(-22 128 150)"/>
  <rect x="76" y="58" width="104" height="140" rx="16" fill="url(#cardMd)" transform="rotate(-12 128 150)"/>
  <g transform="rotate(-3 128 150)">
    <rect x="76" y="58" width="104" height="140" rx="16" fill="url(#cardLt)"/>
    <polygon points="76,61 112,61 76,97" fill="#aecaff" opacity=".85"/>
  </g>

  <!-- S en degradado -->
  <text x="136" y="178" text-anchor="middle"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-weight="900" font-style="italic" font-size="172"
        fill="url(#sGrad)">S</text>
</svg>
