<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Swalbum logo concepto C">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16263f"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bgC)"/>

  <!-- Cromo / lámina inclinada -->
  <g transform="rotate(-8 128 132)">
    <rect x="78" y="62" width="100" height="140" rx="14" fill="url(#cardC)" stroke="#ffd23f" stroke-width="5"/>
    <!-- esquina foil dorada (despegada) -->
    <polygon points="178,62 178,92 148,62" fill="#ffd23f"/>
    <!-- balón dentro del cromo -->
    <circle cx="128" cy="120" r="34" fill="#16263f"/>
    <polygon points="128,108 140,117 136,131 120,131 116,117" fill="#eaf1ff"/>
    <g stroke="#eaf1ff" stroke-width="3" stroke-linecap="round">
      <line x1="128" y1="108" x2="128" y2="92"/>
      <line x1="140" y1="117" x2="156" y2="111"/>
      <line x1="136" y1="131" x2="146" y2="146"/>
      <line x1="120" y1="131" x2="110" y2="146"/>
      <line x1="116" y1="117" x2="100" y2="111"/>
    </g>
    <rect x="96" y="168" width="64" height="9" rx="4.5" fill="#16263f" opacity=".25"/>
    <rect x="104" y="183" width="48" height="8" rx="4" fill="#16263f" opacity=".15"/>
  </g>

  <!-- Flechas de intercambio -->
  <g fill="none" stroke="#00c2a8" stroke-width="11" stroke-linecap="round">
    <path d="M 40 196 A 30 30 0 0 1 92 212"/>
    <path d="M 216 60 A 30 30 0 0 1 164 44"/>
  </g>
  <polygon points="92,222 104,206 78,202" fill="#00c2a8"/>
  <polygon points="164,34 152,50 178,54" fill="#00c2a8"/>
</svg>
